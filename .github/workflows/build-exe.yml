name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install numpy
          pip install xlsxwriter
          pip install openpyxl
          pip install python-calamine
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile --collect-all python_calamine Fruehwarensystem_WK35.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Fruehwarnsystem_WK35_EXE
          path: dist/*.exe
